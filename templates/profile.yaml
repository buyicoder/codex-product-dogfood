name: custom-profile
description: Describe the target user and product category.
testQuestion: Enter a realistic user prompt.
viewports:
  - desktop
primaryEntryKeywords:
  - start
  - ask
expectedSignals:
  - chatInput
failureSignals:
  - error
criticalControls:
  - name: composer
    selectorIncludes:
      - textarea
      - "[role=\"textbox\"]"
  - name: status
    role:
      - status
  - name: upload
    selectorIncludes:
      - "input[type='file']"
    ariaLabelIncludes:
      - upload
      - attach
  - name: send
    ariaLabelIncludes:
      - send
      - submit
journeys:
  - id: first-run
    title: First run
    userGoal: User can start the core journey.
    steps:
      - action: open
      - action: click
        label: Click a likely primary entry
        target:
          kind: keyword
          values:
            - start
            - ask
        optional: true
      - action: fill
        label: Fill the primary input
        target:
          kind: bestInput
        value: "{{testQuestion}}"
      - action: press
        label: Submit with Enter
        key: Enter
      - action: observe
        label: Observe the result
